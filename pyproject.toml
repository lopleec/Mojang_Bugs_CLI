[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Mojang_Bugs_CLI"
version = "0.2.0"
description = "A small Python CLI for searching and exporting public Mojang bug reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Lopleec"}]

[project.urls]
Repository = "https://github.com/lopleec/Mojang_Bugs_CLI"
Issues = "https://github.com/lopleec/Mojang_Bugs_CLI/issues"

[project.scripts]
mojangbugs = "com.lopleec.mojang_bugs_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["com.lopleec.mojang_bugs_cli*"]
namespaces = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
